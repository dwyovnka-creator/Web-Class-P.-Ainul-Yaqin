<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Pegawai</title>
</head>
<style>
    body {
      font-family: 'Comic Sans MS', cursive;
      background-color: #e8ddb4;
      color: #8a5f41;
      padding: 30px 16px;
    }
    .container{
        max-width: 620px;
        margin: auto;
        }
    .header-card {
      background: white;
      border: 1.5px solid #815b3e;
      border-radius: 15px;
      text-align: center;
      padding: 24px;
      margin-bottom: 16px;
    }
    .header-card h1 {
      font-size: 28px;
      color: #9a6200;
      margin-bottom: 8px;
    }
    .header-card p {
      font-size: 13px;
      color: #4e3409;
      line-height: 1.6;
    }

    .pesan{
      border-radius: 8px;
      padding: 10px 15px;
      margin-bottom: 16px;
      display: none;
      font-size: 14px;
    }
    .pesan.error{
      background: #fdecea;
      border: 1px solid #f5b8b8;
      color: #a52020;
    }
    .pesan.sukses{
      background: #fdecea;
      border: 1px solid #bdf5b8;
      color: #20a557;
    }
    button {
      display: block;
      width: 100%;
      padding: 12px;
      background: #9a6200;
      color: white;
      font-size: 15px;
      font-weight: bold;
      font-family: 'Comic Sans MS', cursive;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover { 
      background: #c8860a; 
    }

    .form-card{
      background: #a0cfa0;
      border: 1.5px solid #3d573a;
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 16px;
    }

    .form-card h2 {
      font-size: 24px;
      color: #352c0e;
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #ecd9a8;
    }

    .result-card {
      background: white;
      border: 1.5px solid #d4b87a;
      border-radius: 15px;
      padding: 24px 28px;
      display: none;
    }

    .result-card h2 {
      font-size: 18px;
      color: #9a6200;
      margin-bottom: 16px;
      padding-bottom: 15px;
      border-bottom: 1.5px solid #ecd9a8;
    }

    .result-card { 
      width: 100%; 
    }
    .result-card tr:last-child {
      border-bottom: none;
    }

    .result-card td:first-child {
      width: 160px;
      font-weight: bold;
      color: #42321f;
      padding: 8px 10px 8px 0;
    }

    .result-card td:last-child {
      color: #3d2b0e;
      padding: 8px 0;
    }

    table{
        width: 100%;
        border-collapse: collapse;
    }
    td{
      padding: 7px;
      vertical-align: none;
    }
    td:first-child {
      width: 150px;
      font-weight: bold;
      color: #352c0e;
      white-space: nowrap;
    }

    .badge {
      background: #fdf0d5;
      color: #9a6200;
      border: 1px solid #dbb86e;
      border-radius: 20px;
      padding: 3px 14px;
      font-weight: bold;
    }

    .form-card h2{
        color: #6d3e00;
        text-align: center;
        margin-top: 0;
    }
    input, select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 2px solid #d4b87a;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Comic Sans MS', cursive;
      color: #9a6200;
      background: white;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #c8860a;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }
    hr{
      border: none;
      border-top: 1.5px solid #ecd9a8;
      margin: 18px 0;
    }
</style>
<body>
    
    <div class="container">
        <div class="header-card">
          <h1>Formulir Data Pegawai</h1>
          <p>
              Nama : Dewi Wuryan | NIM : 2421400173 <br>
              Mata Kuliah : Web Pemrograman| UTS Semester III
          </p>
        </div>

        <div class="pesan error"  id="pesanError"></div>
        <div class="pesan sukses" id="pesanSukses"></div>

        <div class="form-card">
            <h2>Data Pegawai</h2>
                    <table>
                    <tr>
                        <td>Nama Pegawai</td>
                        <td><input type="text" id="nama" placeholder="Masukkan Nama Lengkap"></td>
                    </tr>
                    <tr>
                        <td>Nomor Pegawai</td>
                        <td><input type="number" id="nomor" placeholder="Masukkan Nomor Pegawai"></td>
                    </tr>
                    <tr>
                    <td>Tanggal Masuk</td>
                        <td><input type="date" id="tanggal" placeholder="Masukkan Tanggal Masuk"></td>
                    </tr>
                    <tr>
                    <td>Email</td>
                        <td><input type="email" id="email" placeholder="contoh@gmail.com"></td>
                    </tr>
                    <tr>
                    <td>Alamat</td>
                        <td><textarea id="alamat" placeholder="Masukkan Alamat Lengkap"></textarea></td>
                    </tr>
                    <tr>
                    <td>Upload Foto Pegawai</td>
                        <td><input type="file" id="foto" placeholder="Upload Foto Diri"></td>
                    </tr>
                    <tr>
                      <td>Jabatan</td>
                      <td>
                        <select id="jabatan">
                            <option value="">------Pilih Jabatan------</option>
                            <option>Admin</option>
                            <option>Staff</option>
                            <option>Manager</option>
                            <option>Direktur</option>
                        </select>
                      </td>
                    </tr>
                </table>
                <hr>
            <button onclick="tampilkanData()">Tampilkan Data Pegawai</button>
        </div>
        
        <div class="result-card" id="hasil">
            <h2>Data Pegawai</h2>
            <table>
            <tr><td>Nama Pegawai</td>  <td id="hasil_nama"></td></tr>
            <tr><td>Nomor Pegawai</td> <td id="hasil_nomor"></td></tr>
            <tr><td>Tanggal Masuk</td> <td id="hasil_tanggal"></td></tr>
            <tr><td>Email</td>         <td id="hasil_email"></td></tr>
            <tr><td>Alamat</td>        <td id="hasil_alamat"></td></tr>
            <tr><td>Upload Foto</td>   <td id="hasil_foto"></td></tr>
        
            <tr>
                <td>Jabatan</td>
                <td><span class="badge" id="hasil_jabatan"></span></td>
            </tr>
            </table>
        </div>
</body>
<script>
        function tampilkanData(){
            let nama    = document.getElementById("nama").value.trim();
            let nomor   = document.getElementById("nomor").value.trim();
            let tanggal = document.getElementById("tanggal").value;
            let email   = document.getElementById("email").value.trim();
            let alamat  = document.getElementById("alamat").value.trim();
            let jabatan = document.getElementById("jabatan").value;
            let fotoInput = document.getElementById("foto");
            let foto = "";
          if (fotoInput.files.length > 0) {
              foto = fotoInput.files[0].name;
            } 
          else {
              foto = "";
            }

                let hasil = [
                [nama,    "Nama Pegawai"],
                [nomor,   "Nomor Pegawai"],
                [tanggal, "Tanggal Masuk"],
                [email, "Email"],
                [alamat,   "Alamat"],
                [foto,  "Upload Foto"],
                [jabatan,    "Jabatan"]
            ];
            let kosong = [];
            for (let i = 0; i < hasil.length; i++) {
              if (hasil[i][0] === "") {
                  kosong.push(hasil[i][1]);
                  }
      }
        // Tampilkan kartu hasil dan pesan sukses
        let elError  = document.getElementById("pesanError");
        let elSukses = document.getElementById("pesanSukses");
        elError.style.display  = "none";
        elSukses.style.display = "none";

        if (kosong.length > 0) {
        elError.innerHTML = "Field wajib diisi: <strong>" + kosong.join(", ") + "</strong>";
        elError.style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
         let bagian = tanggal.split("-");
        let tanggalRapi = bagian[2] + "/" + bagian[1] + "/" + bagian[0];

        // Isi tabel hasil
        document.getElementById("hasil_nama").textContent    = nama;
        document.getElementById("hasil_nomor").textContent   = nomor;
        document.getElementById("hasil_tanggal").textContent = tanggalRapi;
        document.getElementById("hasil_email").textContent   = email;
        document.getElementById("hasil_alamat").textContent  = alamat;
        document.getElementById("hasil_foto").textContent    = foto;
        document.getElementById("hasil_jabatan").textContent = jabatan;
       
        document.getElementById("hasil").style.display = "block";
        elSukses.innerHTML = "Data berhasil ditampilkan!";
        elSukses.style.display = "block";

        // Scroll ke kartu hasil
        document.getElementById("hasil").scrollIntoView({ behavior: 'smooth' });
        }
        
        
    </script>
</html>
