<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<style>
    body{
        background-color: rgb(88, 86, 86);
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
        .card-overlay {
    width: 420px;
    height: 290px;
    margin: 80px auto;
    border-radius: 22px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }
    .card-overlay img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    }
    .teks-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 8px 15px;
    background-color: rgba(0,0,0,0.6);
    color: white;
    }
    .teks-overlay h2{
        text-align: center;
        margin: 5px 0;
    }
    .teks-overlay p{
        text-align: justify;
    }
</style>
<body>
    <div class="card-overlay">
    <img src="bg.jpg" alt="Web Programming">
    <div class="teks-overlay">
        <h2>Web Programming</h2>
        <p>Belajar membuat teks dalam gambar, aku memilih gambar ini karena aku suka monokrom. coding jadi lebih asik dehh</p>
    </div>
</body>
</body>
</html>
