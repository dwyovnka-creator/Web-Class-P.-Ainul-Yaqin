<!DOCTYPE html>
<html>
<head>
 <title>Card Biodata</title>
 <style>
    body {
    font-family: Arial, sans-serif;
    background-color: #f0ff99;
    }
    .biodata {
    width: 330px;
    background-color: white;
    margin: 50px auto;
    padding: 30px;
    border-radius: 24px;
    text-align: center;
    box-shadow: 0 8px 18px rgba(0,0,0,0.15);
    }
    .biodata img {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #fff237;
    }
    .biodata h2 { color: #41351b; }
    .biodata p { color: #41351b; }
    .tombol {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 18px;
    background-color: #d3c60c;
    color: white;
    text-decoration: none;
    border-radius: 20px;
    }
    .biodata p span{
    display: inline-block;
    width: 80px;
    text-align: left;
   }
   .biodata p{
    text-align: left;
   }
    .tombol:hover { background-color: #c08d00; }
    </style>
</head>
<body>
 <div class="biodata">
 <img src="profil.jpg" alt="Foto Mahasiswa">
 <h2><strong>Dewi Wuryan</strong></h2>
 <p><strong><span>NIM</span></strong> : 2421400173</p>
 <p><strong><span>Jurusan</span></strong> : Teknik Informatika</p>
 <p><strong><span>Alamat</span></strong> : Situbondo</p>
  <a href="#" class="tombol">Lihat Profil</a>
 </div>
</body>
</html>
