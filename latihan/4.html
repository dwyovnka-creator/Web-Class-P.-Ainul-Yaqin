<!DOCTYPE html>
<html>
<head>
 <title>Dua Kartu</title>
 <style>
    body {
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    background-color: #ebebeb;
    }
    .container-card {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 60px;
    padding-top: 20px;
    }
    .card {
    width: 260px;
    background-color: white;
    padding: 24px;
    border-radius: 20px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.12);
    
    }
    .card h1 {
    color: blanchedalmond;
    width: 100px;
    height: 100px;
    background-color: #475569;
    border-radius: 20px;
    text-align: center;
    padding: 6px;
    margin: left;
    align-items: center;
    display: flex;
    justify-content: center;
    font-size: 30px;
    }

    .card h2 { color: 
        #2a292e; }
    .card p { 
        color: #475569;
        text-align: left;
    }
 </style>
</head>
<body>
    <div class="container-card">
        <div class="card">
            <h1>H</h1>
            <h2>HTML</h2>
            <p>HTML digunakan untuk membuat struktur halaman web.</p>
        </div>
   
        <div class="card">
            <h1>C</h1>
            <h2>CSS</h2>
            <p>CSS digunakan untuk mempercantik tampilan halaman web.</p>
        </div>
 </div>
</body>
</html>
