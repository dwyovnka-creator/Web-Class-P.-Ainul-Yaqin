<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color: rgb(105, 95, 95);
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
    .kartu{
        width: 340px;
        background-color: white;
        margin: 50px auto;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 16px rgba(0,0,0,0.15);

    }
    .kartu img{
        width: 100%;
        border-radius: 20px 20px 0 0;
        height: 210px;
        object-fit: cover;
    }
    .isi-card{
        padding: 20px;
        color: rgb(63, 48, 29);
    }
    .isi-card h2{
        color: rgb(92, 62, 7);
        text-align: center;
        margin-top: 0;
        }
    .isi-card p{
        text-align: justify;
    }
</style>
<body>
    <div class="kartu">
        <img src="bg.jpg" alt="">
        <div class="isi-card">
            <h2>Kartu Gambar</h2>
            <p>Ini adalah gambar abstrak yang dibuat dengan perpaduan warna monokrom, yang pastinya membuat siapa saja yang melihat menjadi tertarik untuk memilikinya, gambar yang sangat menarik bukan, ini adalah gambar abstrak yang paling aku suka</p>
        </div>       
    </div>
</body>
</html>
